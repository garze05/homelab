services:
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    expose:
      - "9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/docker/portainer/data:/data

    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
