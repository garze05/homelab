services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped

    ports:
      - "80:80"
      - "81:81"
      - "443:443"

    volumes:
      - /srv/docker/nginx-proxy-manager/data:/data
      - /srv/docker/nginx-proxy-manager/letsencrypt:/etc/letsencrypt

    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
