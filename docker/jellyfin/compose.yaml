services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    expose:
      - 8096
      - 7359
    volumes:
      - /srv/docker/jellyfin/config:/config
      - /srv/docker/jellyfin/cache:/cache
      - type: bind
        source: /srv/docker/jellyfin/media
        target: /media
      - type: bind
        source: /srv/docker/jellyfin/media2
        target: /media2
        read_only: true
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      - type: bind
        source: /srv/docker/jellyfin/fonts
        target: /usr/local/share/fonts/custom
        read_only: true
    restart: 'unless-stopped'

    networks:
      - proxy-net
    # Optional - alternative address used for autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=https://cine.lab.gabrielro.com
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'
networks:
  proxy-net:
    external: true